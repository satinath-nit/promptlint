# Example PromptLint Policy for Financial Services
# This is a more comprehensive example showing various policy configurations

version: 1

policies:
  # === PII Detection ===
  
  - id: pii-email
    description: "Detect email addresses in prompts"
    severity: warn
    match:
      type: built_in
      detector: email
    applies_to:
      contexts: ["user_input", "prompt_template"]
    actions:
      - type: annotate
      - type: suggest_redact

  - id: pii-phone
    description: "Detect phone numbers in prompts"
    severity: warn
    match:
      type: built_in
      detector: phone
    actions:
      - type: annotate
      - type: suggest_redact

  - id: pii-ssn
    description: "Block Social Security Numbers"
    severity: error
    match:
      type: built_in
      detector: ssn
    actions:
      - type: block
      - type: message
        text: "SSNs must never be sent to external LLMs - this is a compliance violation"

  - id: pii-credit-card
    description: "Block credit card numbers (PCI-DSS compliance)"
    severity: error
    match:
      type: built_in
      detector: credit_card
    actions:
      - type: block
      - type: message
        text: "Credit card data violates PCI-DSS - remove before processing"

  # === Secrets Detection ===

  - id: secrets-api-key
    description: "Detect API keys and secrets"
    severity: error
    match:
      type: built_in
      detector: api_key
    actions:
      - type: block

  - id: secrets-aws
    description: "Detect AWS access keys"
    severity: error
    match:
      type: built_in
      detector: aws_key
    actions:
      - type: block
      - type: message
        text: "AWS credentials detected - rotate immediately if exposed"

  - id: secrets-jwt
    description: "Detect JWT tokens"
    severity: error
    match:
      type: built_in
      detector: jwt
    actions:
      - type: block

  # === Infrastructure Protection ===

  - id: internal-hostnames
    description: "Block internal hostnames and domains"
    severity: error
    match:
      type: regex
      pattern: "(?:\\.internal\\.|corp\\.|\\-internal\\.|\\.local\\b)"
    actions:
      - type: block
      - type: message
        text: "Internal infrastructure details should not be exposed"

  - id: private-ip-ranges
    description: "Block private IP addresses"
    severity: error
    match:
      type: regex
      pattern: "\\b(?:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})\\b"
    actions:
      - type: block

  # === Business Confidentiality ===

  - id: confidential-projects
    description: "Block internal project codenames"
    severity: warn
    match:
      type: list
      terms:
        - "Project Phoenix"
        - "Operation Sunrise"
        - "Initiative Alpha"
      case_sensitive: false
    actions:
      - type: warn
      - type: message
        text: "Use public product names instead of internal codenames"

  - id: financial-terms
    description: "Flag financial regulatory terms for review"
    severity: info
    match:
      type: list
      terms:
        - "material non-public"
        - "insider information"
        - "trading restriction"
      case_sensitive: false
    actions:
      - type: annotate
      - type: message
        text: "Content may contain sensitive financial information - review before sending"

# Environment-specific overrides
overrides:
  - env: development
    disable_policies:
      - pii-email
      - pii-phone
      
  - env: staging
    disable_policies:
      - financial-terms
